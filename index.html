<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Beautiful Peafowl</title>
<style>
  /* ---------- PIN GATE ---------- */
  .pin-gate{
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #fff5f8 0%, #ffd0dd 45%, #ffb3cb 100%);
    transition: opacity 0.5s ease;
  }
  .pin-gate.hidden{
    opacity: 0;
    pointer-events: none;
  }

  .pin-card{
    text-align: center;
    padding: 28px 26px;
    max-width: 320px;
    width: 100%;
  }
  .pin-card.shake{ animation: pin-shake 0.4s ease; }
  @keyframes pin-shake{
    0%, 100%{ transform: translateX(0); }
    20%, 60%{ transform: translateX(-8px); }
    40%, 80%{ transform: translateX(8px); }
  }

  .pin-icon{ font-size: 2rem; margin-bottom: 8px; }
  .pin-title{
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    font-size: 1.3rem;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .pin-subtitle{
    font-size: 0.8rem;
    opacity: 0.8;
    margin: 0 0 22px;
  }
  .pin-input{
    width: 100%;
    text-align: center;
    letter-spacing: 0.6em;
    font-size: 1.3rem;
    padding: 12px 12px 12px 18px;
    border-radius: 14px;
    border: 1px solid rgba(217,90,125,0.3);
    outline: none;
    margin-bottom: 14px;
    font-family: 'Trebuchet MS', monospace;
    background: #fff;
    color: var(--ink);
  }
  .pin-input:focus{
    border-color: var(--wax);
    box-shadow: 0 0 0 3px rgba(217,90,125,0.15);
  }
  .pin-submit{
    border: none;
    cursor: pointer;
    width: 100%;
    padding: 12px 30px;
    border-radius: 999px;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    background: linear-gradient(160deg, var(--wax-light), var(--wax));
    color: #fff;
    box-shadow: 0 8px 20px rgba(217,90,125,0.35);
    transition: transform 0.15s ease, opacity 0.2s ease;
  }
  .pin-submit:hover{ transform: translateY(-2px); }
  .pin-submit:disabled{ opacity: 0.6; cursor: default; transform: none; }
  .pin-status{
    font-size: 0.78rem;
    color: #c9587c;
    min-height: 18px;
    margin-top: 12px;
  }

  :root{
    --ink: #4b2b3a;
    --wax: #d95a7d;
    --wax-light: #f27a99;
    --admin-blue: #4b7de0;
    --admin-blue-light: #6fa3ff;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; }
  body{
    min-height: 100vh;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    color: var(--ink);
    overflow: hidden;
    position: relative;
  }

  /* ---------- BACKGROUND PER MODE (dipakai bersama Halaman Depan & Chat) ---------- */
  .mode-bg{
    position: fixed;
    inset: 0;
    max-width: 900px;
    margin: 0 auto;
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .mode-bg.active{ opacity: 1; }

  .bg-pagi{ background: linear-gradient(160deg, #ffffff 0%, #ffeef0 45%, #ffd9e4 100%); }
  .bg-siang{ background: linear-gradient(160deg, #fff5f8 0%, #ffd0dd 45%, #ffb3cb 100%); }
  .bg-sore{ background: linear-gradient(160deg, #ffe3d6 0%, #ffc2c9 45%, #f497ae 100%); }
  .bg-malam{ background: linear-gradient(160deg, #5c2740 0%, #7a3350 55%, #532038 100%); }

  .bg-pagi .sun{
    position: absolute; top: 8%; right: 10%; width: 80px; height: 80px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff3d6, #ffcf7a);
    box-shadow: 0 0 55px 18px rgba(255,207,122,0.32);
  }
  .bg-siang .sun{
    position: absolute; top: 6%; left: 50%; transform: translateX(-50%); width: 62px; height: 62px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff9e0, #ffd66b);
    box-shadow: 0 0 44px 14px rgba(255,214,107,0.38);
  }
  .bg-sore .sun{
    position: absolute; bottom: 12%; right: 14%; width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe3ba, #ff9a6e);
    box-shadow: 0 0 55px 18px rgba(255,154,110,0.38);
  }
  .bg-malam .moon{
    position: absolute; top: 8%; right: 12%; width: 56px; height: 56px; border-radius: 50%;
    background: #fff3e0;
    box-shadow: -12px 3px 0 3px #7a3350, 0 0 36px 9px rgba(255,243,224,0.24);
  }

  .bg-pagi .petal, .bg-siang .confetti{
    position: absolute; opacity: 0.5;
    animation: drift-down 9s linear infinite;
  }
  .bg-sore .cloud{
    position: absolute;
    background: rgba(255,255,255,0.5);
    border-radius: 999px;
    filter: blur(1px);
    animation: cloud-move 32s linear infinite;
  }
  .bg-malam .star{
    position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%;
    animation: twinkle 2.4s ease-in-out infinite;
  }

  @keyframes drift-down{
    0%{ transform: translateY(-10vh) rotate(0deg); opacity: 0; }
    10%{ opacity: 0.55; }
    100%{ transform: translateY(110vh) rotate(180deg); opacity: 0; }
  }
  @keyframes cloud-move{
    0%{ transform: translateX(-10vw); } 100%{ transform: translateX(110vw); }
  }
  @keyframes twinkle{
    0%, 100%{ opacity: 0.2; transform: scale(1); } 50%{ opacity: 1; transform: scale(1.6); }
  }

  /* ---------- VIEW SWITCHER (Halaman Depan <-> Chat) ---------- */
  .view{
    position: fixed;
    inset: 0;
    z-index: 1;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .view.is-active{
    opacity: 1;
    pointer-events: auto;
    z-index: 2;
  }

  /* ---------- HALAMAN DEPAN ---------- */
  .view-welcome{
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .welcome-content{
    text-align: center;
    padding: 24px;
    max-width: 380px;
  }
  .welcome-icon{ font-size: 2.4rem; margin-bottom: 10px; }
  .welcome-greeting{
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    font-size: 1.7rem;
    margin: 0 0 8px;
  }
  .welcome-subtitle{
    font-size: 0.88rem;
    opacity: 0.85;
    margin: 0 0 28px;
  }
  .welcome-cta{
    border: none;
    cursor: pointer;
    padding: 12px 30px;
    border-radius: 999px;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    background: linear-gradient(160deg, var(--wax-light), var(--wax));
    color: #fff;
    box-shadow: 0 8px 20px rgba(217,90,125,0.35);
    transition: transform 0.15s ease;
  }
  .welcome-cta:hover{ transform: translateY(-2px); }

  body.mode-malam .welcome-greeting,
  body.mode-malam .welcome-subtitle{ color: #fff0f4; }
  body.mode-malam .welcome-cta{ background: linear-gradient(160deg, #ffb3c9, #ff8fb0); color: #5c2740; }

  /* ---------- CHAT ---------- */
  .view-chat{
    display: flex;
    flex-direction: column;
  }

  .chat-header{
    position: relative;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 16px 14px;
    border-bottom: 1px solid rgba(217,90,125,0.15);
    transition: border-color 0.8s ease;
  }
  body.mode-malam .chat-header{ border-color: rgba(255,255,255,0.15); }

  .back-btn{
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: rgba(217,90,125,0.12);
    color: #c9587c;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
  }
  body.mode-malam .back-btn{ background: rgba(255,255,255,0.15); color: #fff0f4; }

  .mode-icon{ font-size: 1.6rem; }

  .chat-area{
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px 18px 10px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .bubble-row{
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    animation: bubble-in 0.3s ease both;
  }
  .bubble-row.admin{ align-items: flex-start; }
  @keyframes bubble-in{
    0%{ opacity: 0; transform: translateY(6px); } 100%{ opacity: 1; transform: translateY(0); }
  }

  .comment-name{
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    color: #c9587c;
    margin: 0 6px 3px 0;
  }
  .bubble-row.admin .comment-name{ margin: 0 0 3px 6px; color: var(--admin-blue); }

  .comment-bubble{
    position: relative;
    background: linear-gradient(160deg, #ffffff, #fdf0f4);
    border-radius: 14px 4px 14px 14px;
    padding: 8px 12px;
    box-shadow: 0 2px 6px rgba(217,90,125,0.1);
    max-width: 86%;
  }
  .comment-bubble.admin{
    background: linear-gradient(160deg, var(--admin-blue-light), var(--admin-blue));
    border-radius: 4px 14px 14px 14px;
    box-shadow: 0 2px 6px rgba(75,125,224,0.25);
  }

  .comment-text{
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.85rem;
    line-height: 1.4;
    color: var(--ink);
    margin: 0;
    word-break: break-word;
  }
  .comment-bubble.admin .comment-text{ color: #fff; }

  .comment-time{
    display: block;
    margin-top: 3px;
    text-align: right;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.6rem;
    color: #d7a3b3;
    white-space: nowrap;
  }
  .comment-bubble.admin .comment-time{ color: rgba(255,255,255,0.75); text-align: left; }

  .comments-empty{
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.8rem;
    color: #c9748f;
    text-align: center;
    padding: 18px 0;
    opacity: 0.75;
  }

  /* ---------- REPLY (tahan/hold bubble buat membalas) ---------- */
  .comment-bubble{
    cursor: pointer;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    transition: transform 0.15s ease;
  }
  .comment-bubble.pressing{ transform: scale(0.96); }
  .comment-bubble.reply-flash{ animation: reply-flash 0.4s ease; }
  @keyframes reply-flash{
    0%{ box-shadow: 0 0 0 0 rgba(217,90,125,0.5); }
    100%{ box-shadow: 0 0 0 12px rgba(217,90,125,0); }
  }
  .comment-bubble.admin.reply-flash{ animation: reply-flash-admin 0.4s ease; }
  @keyframes reply-flash-admin{
    0%{ box-shadow: 0 0 0 0 rgba(75,125,224,0.5); }
    100%{ box-shadow: 0 0 0 12px rgba(75,125,224,0); }
  }

  .reply-quote{
    border-left: 3px solid var(--wax);
    background: rgba(217,90,125,0.08);
    border-radius: 6px;
    padding: 4px 8px;
    margin-bottom: 5px;
  }
  .comment-bubble.admin .reply-quote{
    border-left-color: #fff;
    background: rgba(255,255,255,0.18);
  }
  .reply-quote-name{
    font-size: 0.62rem;
    font-weight: 700;
    color: var(--wax);
    margin: 0;
  }
  .comment-bubble.admin .reply-quote-name{ color: #fff; }
  .reply-quote-text{
    font-size: 0.72rem;
    color: #8a5566;
    margin: 1px 0 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
  }
  .comment-bubble.admin .reply-quote-text{ color: rgba(255,255,255,0.85); }

  .reply-banner{
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 18px 8px;
    padding: 6px 10px;
    background: rgba(217,90,125,0.08);
    border-left: 3px solid var(--wax);
    border-radius: 8px;
  }
  .reply-banner[hidden]{ display: none; }
  .reply-banner-text{ flex: 1; min-width: 0; }
  .reply-banner-name{
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--wax);
    margin: 0;
  }
  .reply-banner-message{
    font-size: 0.72rem;
    color: #8a5566;
    margin: 1px 0 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .reply-banner-close{
    flex: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: rgba(217,90,125,0.15);
    color: #c9587c;
    font-size: 0.7rem;
    display: flex; align-items: center; justify-content: center;
  }
  body.mode-malam .reply-banner{ background: rgba(255,255,255,0.1); }
  body.mode-malam .reply-banner-name{ color: #ffc9db; }
  body.mode-malam .reply-banner-message{ color: #f2c6d4; }

  /* ---------- INDIKATOR SEDANG MENGETIK ---------- */
  .typing-indicator{
    flex: none;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.7rem;
    font-style: italic;
    color: #c9748f;
    margin: 0 18px 6px;
  }
  .typing-indicator[hidden]{ display: none; }
  .typing-indicator #typingName{ font-weight: 700; font-style: normal; }
  .typing-indicator.admin #typingName{ color: var(--admin-blue); }
  .typing-indicator.admin .typing-dots span{ background: var(--admin-blue); }

  .typing-dots{ display: inline-flex; align-items: center; gap: 2px; }
  .typing-dots span{
    width: 4px; height: 4px; border-radius: 50%; background: #e08098;
    animation: typing-bounce 1.1s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2){ animation-delay: 0.15s; }
  .typing-dots span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes typing-bounce{
    0%, 60%, 100%{ transform: translateY(0); opacity: 0.5; } 30%{ transform: translateY(-3px); opacity: 1; }
  }

  /* ---------- INPUT BAR ---------- */
  .comment-form{
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 18px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(217,90,125,0.15);
    background: rgba(255,255,255,0.5);
    transition: border-color 0.8s ease, background 0.8s ease;
  }
  body.mode-malam .comment-form{ border-color: rgba(255,255,255,0.15); background: rgba(0,0,0,0.15); }

  .message-row{
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border-radius: 999px;
    padding: 6px 6px 6px 6px;
    box-shadow: 0 4px 14px rgba(217,90,125,0.15);
  }

  .emoji-toggle{
    flex: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: rgba(224,128,152,0.12);
    color: #c9587c;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s ease, transform 0.15s ease;
    margin-left: 6px;
  }
  .emoji-toggle:hover{ background: rgba(224,128,152,0.22); }
  .emoji-toggle.active{ background: var(--wax); color: #fff; transform: scale(1.05); }

  .message-field{
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
  }
  .message-field::placeholder{ color: rgba(201,88,124,0.4); font-style: italic; }

  .hp-field{ position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  .comment-send{
    flex: none;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: linear-gradient(160deg, var(--wax-light), var(--wax));
    color: #fff;
    font-size: 0.95rem;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(217,90,125,0.35);
    transition: transform 0.15s ease, opacity 0.2s ease;
    margin-right: 2px;
  }
  .comment-send:hover{ transform: translateY(-1px) scale(1.05); }
  .comment-send:disabled{ opacity: 0.55; cursor: default; transform: none; }

  .comment-status{
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.7rem;
    color: #c9748f;
    min-height: 14px;
    margin: 0 0 0 4px;
  }

  .emoji-panel{
    position: absolute;
    left: 40px;
    bottom: 48px;
    width: 216px;
    max-height: 160px;
    overflow-y: auto;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 10px 24px rgba(217,90,125,0.25);
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 2px;
    z-index: 20;
  }
  .emoji-panel[hidden]{ display: none; }
  .emoji-panel button{
    border: none;
    background: transparent;
    font-size: 1.1rem;
    padding: 5px 0;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .emoji-panel button:hover{ background: rgba(224,128,152,0.15); transform: scale(1.15); }

  @media (max-width: 420px){
    .welcome-content{ max-width: 90vw; padding: 20px; }
    .welcome-icon{ font-size: 2rem; }
    .welcome-greeting{ font-size: 1.35rem; }
    .welcome-subtitle{ font-size: 0.8rem; margin-bottom: 22px; }
    .welcome-cta{ padding: 11px 26px; font-size: 0.85rem; }
    .bg-pagi .sun{ width: 56px; height: 56px; }
    .bg-siang .sun{ width: 46px; height: 46px; }
    .bg-sore .sun{ width: 64px; height: 64px; }
    .bg-malam .moon{ width: 42px; height: 42px; }
  }
</style>
</head>
<body>

  <div class="pin-gate" id="pinGate">
    <form class="pin-card" id="pinForm">
      <div class="pin-icon">🔒</div>
      <h1 class="pin-title">Enter Pin</h1>
      <p class="pin-subtitle">Private Chat</p>
      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" class="pin-input" id="pinInput" placeholder="••••••" autocomplete="off" required>
      <button type="submit" class="pin-submit" id="pinSubmit">Log In</button>
      <p class="pin-status" id="pinStatus"></p>
    </form>
  </div>

  <div class="mode-bg bg-pagi" id="bg-pagi"><div class="sun"></div></div>
  <div class="mode-bg bg-siang" id="bg-siang"><div class="sun"></div></div>
  <div class="mode-bg bg-sore" id="bg-sore"><div class="sun"></div></div>
  <div class="mode-bg bg-malam" id="bg-malam"><div class="moon"></div></div>

  <div class="view view-welcome is-active" id="viewWelcome">
    <div class="welcome-content">
      <div class="welcome-icon" id="welcomeIcon">☀️</div>
      <h1 class="welcome-greeting" id="welcomeGreeting">Good Morning, Peafowl</h1>
      <p class="welcome-subtitle" id="welcomeSubtitle">I hope you doing great today! ☁️</p>
      <button type="button" class="welcome-cta" id="welcomeCta">Start Chat ♥</button>
    </div>
  </div>

  <div class="view view-chat" id="viewChat">
    <div class="chat-header">
      <button type="button" class="back-btn" id="backBtn" aria-label="Kembali ke halaman depan">‹</button>
      <span class="mode-icon" id="modeIcon">☀️</span>
    </div>

    <div class="chat-area" id="commentsList">
      <p class="comments-empty" id="commentsEmpty">Loading reply, please wait...</p>
    </div>

    <p class="typing-indicator" id="typingIndicator" hidden>
      <span id="typingName"></span> sedang mengetik<span class="typing-dots"><span></span><span></span><span></span></span>
    </p>

    <div class="reply-banner" id="replyBanner" hidden>
      <div class="reply-banner-text">
        <p class="reply-banner-name" id="replyBannerName"></p>
        <p class="reply-banner-message" id="replyBannerMessage"></p>
      </div>
      <button type="button" class="reply-banner-close" id="replyBannerClose" aria-label="Batal membalas">✕</button>
    </div>

    <form class="comment-form" id="commentForm">
      <div class="message-row">
        <button type="button" class="emoji-toggle" id="emojiToggle" aria-label="Pilih emoji">☺</button>
        <input type="text" id="commentMessage" class="message-field" placeholder="reply here" maxlength="300" required autocomplete="off">
        <input type="text" class="hp-field" id="hpField" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit" class="comment-send" id="commentSubmit" aria-label="Kirim balasan">♥</button>
        <div class="emoji-panel" id="emojiPanel" hidden></div>
      </div>
      <p class="comment-status" id="commentStatus"></p>
    </form>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ====== GANTI DUA BARIS INI dengan URL & anon key project Supabase kamu ======
  const SUPABASE_URL = 'https://vyrmeihqaljugjnysbxs.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_OfHSvklftlzryhEJbbNsCg_hNAKvWhU';
  // ================================================================================

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* ================= PIN GATE ================= */
  const pinGate = document.getElementById('pinGate');
  const pinForm = document.getElementById('pinForm');
  const pinInput = document.getElementById('pinInput');
  const pinStatus = document.getElementById('pinStatus');
  const pinCard = document.getElementById('pinForm');
  const pinSubmit = document.getElementById('pinSubmit');

  let USER_IDENTITY = sessionStorage.getItem('userIdentity'); // 'Ananda' | 'Peafowl' | null

  function getDeviceToken(){
    let token = sessionStorage.getItem('deviceToken');
    if(!token){
      token = (window.crypto?.randomUUID)
        ? window.crypto.randomUUID()
        : 'tok-' + Math.random().toString(36).slice(2) + Date.now();
      sessionStorage.setItem('deviceToken', token);
    }
    return token;
  }
  const deviceToken = getDeviceToken();

  if(USER_IDENTITY){
    pinGate.classList.add('hidden');
  }

  function unlockApp(identity){
    USER_IDENTITY = identity;
    sessionStorage.setItem('userIdentity', identity);
    pinGate.classList.add('hidden');
  }

  pinForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pin = pinInput.value.trim();
    if(pin.length !== 6){
      pinStatus.textContent = 'PIN must 6 digit.';
      return;
    }

    pinSubmit.disabled = true;
    pinStatus.textContent = 'checking...';

    const { data, error } = await supabaseClient.rpc('verify_pin', {
      input_pin: pin,
      client_token: deviceToken
    });

    pinSubmit.disabled = false;

    if(error){
      pinStatus.textContent = 'Pin wrong, try again.';
      console.error(error);
      return;
    }

    if(data.status === 'ok'){
      unlockApp(data.identity);
      return;
    }

    if(data.status === 'locked'){
      const mins = Math.max(1, Math.ceil((new Date(data.locked_until) - Date.now()) / 60000));
      pinStatus.textContent = `Terlalu banyak percobaan salah. Coba lagi dalam ${mins} menit.`;
    } else {
      pinStatus.textContent = `PIN salah. Sisa percobaan: ${data.attempts_left}.`;
    }

    pinInput.value = '';
    pinInput.focus();
    pinCard.classList.remove('shake');
    void pinCard.offsetWidth; // reflow biar animasi shake bisa retrigger
    pinCard.classList.add('shake');
  });

  /* ================= MODE WAKTU (dipakai bersama Halaman Depan & Chat) ================= */
  const bgEls = {
    pagi: document.getElementById('bg-pagi'),
    siang: document.getElementById('bg-siang'),
    sore: document.getElementById('bg-sore'),
    malam: document.getElementById('bg-malam'),
  };
  const welcomeIcon = document.getElementById('welcomeIcon');
  const welcomeGreeting = document.getElementById('welcomeGreeting');
  const welcomeSubtitle = document.getElementById('welcomeSubtitle');
  const modeIcon = document.getElementById('modeIcon');

  const MODE_CONTENT = {
    pagi:  { icon: '☀️', greeting: 'Good Morning, Peafowl', subtitle: 'I hope you doing great today! ☁️' },
    siang: { icon: '🌸', greeting: 'Good Afternoon, Peafowl', subtitle: 'Dont forget take rest for a while ya, and drink lot water!' },
    sore:  { icon: '🌇', greeting: 'Good Evening, Peafowl', subtitle: 'Time for relax, you almost finish your day! YAAAY!' },
    malam: { icon: '🌙', greeting: 'Good Night, Peafowl', subtitle: 'How is your day? You are doing really great today! Lets chat with me ya ♡' },
  };

  function scatter(container, items, count, animDuration){
    for(let i = 0; i < count; i++){
      const el = document.createElement('span');
      el.textContent = items[Math.floor(Math.random() * items.length)];
      el.className = container.dataset.itemClass;
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDelay = (Math.random() * animDuration) + 's';
      container.appendChild(el);
    }
  }
  bgEls.pagi.dataset.itemClass = 'petal';
  scatter(bgEls.pagi, ['🌸','✿','💗'], 10, 9);
  bgEls.siang.dataset.itemClass = 'confetti';
  scatter(bgEls.siang, ['💗','💕','✨'], 12, 6.5);
  const cloud1 = document.createElement('div');
  cloud1.className = 'cloud';
  cloud1.style.cssText = 'top:18%; width:120px; height:34px;';
  bgEls.sore.appendChild(cloud1);
  const cloud2 = document.createElement('div');
  cloud2.className = 'cloud';
  cloud2.style.cssText = 'top:30%; width:80px; height:24px; animation-delay:-10s;';
  bgEls.sore.appendChild(cloud2);
  for(let i = 0; i < 40; i++){
    const star = document.createElement('span');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 70 + '%';
    star.style.animationDelay = (Math.random() * 2.4) + 's';
    bgEls.malam.appendChild(star);
  }

  function applyMode(mode){
    Object.keys(bgEls).forEach(key => bgEls[key].classList.toggle('active', key === mode));
    document.body.className = 'mode-' + mode;
    const data = MODE_CONTENT[mode];
    welcomeIcon.textContent = data.icon;
    welcomeGreeting.textContent = data.greeting;
    welcomeSubtitle.textContent = data.subtitle;
    modeIcon.textContent = data.icon;
  }

  function modeFromClock(){
    const h = new Date().getHours();
    if(h >= 5 && h < 11) return 'pagi';
    if(h >= 11 && h < 15) return 'siang';
    if(h >= 15 && h < 18) return 'sore';
    return 'malam';
  }

  applyMode(modeFromClock());

  /* ================= VIEW SWITCHER ================= */
  const viewWelcome = document.getElementById('viewWelcome');
  const viewChat = document.getElementById('viewChat');
  const welcomeCta = document.getElementById('welcomeCta');
  const backBtn = document.getElementById('backBtn');

  welcomeCta.addEventListener('click', () => {
    viewWelcome.classList.remove('is-active');
    viewChat.classList.add('is-active');
    syncMissed();
    scrollToBottom();
  });
  backBtn.addEventListener('click', () => {
    viewChat.classList.remove('is-active');
    viewWelcome.classList.add('is-active');

    // jaga-jaga kalau lagi ngetik terus pindah halaman, kasih tahu lawan
    // bicara biar indikatornya gak nyangkut kelamaan
    clearTimeout(typingDebounceTimer);
    typingChannel.send({ type: 'broadcast', event: 'typing', payload: { stopped: true } });
  });

  /* ================= CHAT / KOMENTAR ================= */
  const commentsListWrap = document.getElementById('commentsList');
  const commentsList = document.getElementById('commentsList');
  const commentsEmpty = document.getElementById('commentsEmpty');

  const commentForm = document.getElementById('commentForm');
  const commentMessage = document.getElementById('commentMessage');
  const hpField = document.getElementById('hpField');
  const commentSubmit = document.getElementById('commentSubmit');
  const commentStatus = document.getElementById('commentStatus');
  const emojiToggle = document.getElementById('emojiToggle');
  const emojiPanel = document.getElementById('emojiPanel');
  const typingIndicator = document.getElementById('typingIndicator');
  const typingName = document.getElementById('typingName');
  const replyBanner = document.getElementById('replyBanner');
  const replyBannerName = document.getElementById('replyBannerName');
  const replyBannerMessage = document.getElementById('replyBannerMessage');
  const replyBannerClose = document.getElementById('replyBannerClose');

  let replyTo = null; // { name, message }

  function truncate(str, n){
    return str.length > n ? str.slice(0, n - 1) + '…' : str;
  }

  function setReplyTo(name, message){
    replyTo = { name, message: truncate(message, 120) };
    replyBannerName.textContent = name;
    replyBannerMessage.textContent = replyTo.message;
    replyBanner.hidden = false;
    commentMessage.focus();
  }

  function clearReplyTo(){
    replyTo = null;
    replyBanner.hidden = true;
  }

  replyBannerClose.addEventListener('mousedown', (e) => e.preventDefault());
  replyBannerClose.addEventListener('click', clearReplyTo);

  // tahan bubble chat sejenak buat membalasnya, gaya WhatsApp/Telegram
  const HOLD_DURATION_MS = 450;
  const MOVE_CANCEL_PX = 10;

  function attachHoldToReply(bubbleEl, onHold){
    let timer = null;
    let startX = 0, startY = 0;
    let moved = false;

    function start(e){
      moved = false;
      startX = e.clientX;
      startY = e.clientY;
      bubbleEl.classList.add('pressing');
      timer = setTimeout(() => {
        if(moved) return;
        bubbleEl.classList.remove('pressing');
        bubbleEl.classList.add('reply-flash');
        setTimeout(() => bubbleEl.classList.remove('reply-flash'), 400);
        if(navigator.vibrate) navigator.vibrate(12);
        onHold();
      }, HOLD_DURATION_MS);
    }
    function move(e){
      if(Math.abs(e.clientX - startX) > MOVE_CANCEL_PX || Math.abs(e.clientY - startY) > MOVE_CANCEL_PX){
        moved = true;
        cancel();
      }
    }
    function cancel(){
      clearTimeout(timer);
      bubbleEl.classList.remove('pressing');
    }

    bubbleEl.addEventListener('pointerdown', start);
    bubbleEl.addEventListener('pointermove', move);
    bubbleEl.addEventListener('pointerup', cancel);
    bubbleEl.addEventListener('pointerleave', cancel);
    bubbleEl.addEventListener('pointercancel', cancel);
    bubbleEl.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  const renderedIds = new Set();
  let lastSeenAt = null;

  // ---------- EMOJI PICKER ----------
  const EMOJI_LIST = ['🍥','❤️','💕','💖','💗','💘','💌','🥰','😍','😘','🤗','☺️','😊','😂','🙈','😢','😅','✨','🌟','🌸','🌷','☁️','🌙','👉👈','💫'];
  emojiPanel.innerHTML = EMOJI_LIST.map(e => `<button type="button">${e}</button>`).join('');

  emojiToggle.addEventListener('click', () => {
    const willOpen = emojiPanel.hidden;
    emojiPanel.hidden = !willOpen;
    emojiToggle.classList.toggle('active', willOpen);
  });

  // cegah tombol-tombol ini ngerebut fokus dari kolom pesan — ini yang
  // bikin keyboard mobile gak sempat nutup pas milih emoji
  emojiToggle.addEventListener('mousedown', (e) => e.preventDefault());
  emojiPanel.addEventListener('mousedown', (e) => e.preventDefault());

  emojiPanel.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    const emoji = btn.textContent;
    const start = commentMessage.selectionStart ?? commentMessage.value.length;
    const end = commentMessage.selectionEnd ?? commentMessage.value.length;
    const val = commentMessage.value;
    commentMessage.value = val.slice(0, start) + emoji + val.slice(end);
    const newPos = start + emoji.length;
    commentMessage.focus();
    commentMessage.setSelectionRange(newPos, newPos);
  });

  document.addEventListener('click', (e) => {
    if(emojiPanel.hidden) return;
    if(e.target === emojiToggle || emojiPanel.contains(e.target)) return;
    emojiPanel.hidden = true;
    emojiToggle.classList.remove('active');
  });

  // ---------- INDIKATOR SEDANG MENGETIK (Supabase Realtime Broadcast) ----------
  const typingChannel = supabaseClient.channel('typing-status');
  let hideTypingTimeout = null;
  let typingDebounceTimer = null;
  const TYPING_DEBOUNCE_MS = 500;
  const TYPING_HIDE_MS = 3500;

  typingChannel
    .on('broadcast', { event: 'typing' }, ({ payload }) => {
      clearTimeout(hideTypingTimeout);

      // sinyal "berhenti ngetik" (dikirim begitu lawan bicara jadi kirim
      // pesan) -> langsung sembunyikan, gak perlu nunggu timeout habis
      if(payload?.stopped){
        typingIndicator.hidden = true;
        return;
      }

      typingName.textContent = payload?.name || 'Seseorang';
      typingIndicator.classList.toggle('admin', !!payload?.admin);
      typingIndicator.hidden = false;
      hideTypingTimeout = setTimeout(() => { typingIndicator.hidden = true; }, TYPING_HIDE_MS);
    })
    .subscribe();

  commentMessage.addEventListener('input', () => {
    clearTimeout(typingDebounceTimer);
    typingDebounceTimer = setTimeout(() => {
      typingChannel.send({
        type: 'broadcast',
        event: 'typing',
        payload: {
          name: USER_IDENTITY,
          admin: USER_IDENTITY === 'Ananda'
        }
      });
    }, TYPING_DEBOUNCE_MS);
  });

  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && viewChat.classList.contains('is-active')) syncMissed();
  });

  function scrollToBottom(){
    requestAnimationFrame(() => {
      commentsListWrap.scrollTop = commentsListWrap.scrollHeight;
    });
  }

  function formatSentTime(dateStr){
    const d = new Date(dateStr);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const timePart = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    if(sameDay) return timePart;
    const datePart = d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' });
    return datePart + ', ' + timePart;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderComment(row){
    if(row.id != null){
      if(renderedIds.has(row.id)) return;
      renderedIds.add(row.id);
    }
    if(!lastSeenAt || new Date(row.created_at) > new Date(lastSeenAt)){
      lastSeenAt = row.created_at;
    }
    commentsEmpty.remove?.();

    const cleanMessage = row.message || '';
    const isAdmin = row.name === 'Ananda';
    const displayName = row.name;

    const item = document.createElement('div');
    item.className = 'bubble-row' + (isAdmin ? ' admin' : '');
    item.innerHTML = `
      <p class="comment-name">${escapeHtml(displayName)}</p>
      <div class="comment-bubble${isAdmin ? ' admin' : ''}">
        ${row.reply_name ? '<div class="reply-quote"><p class="reply-quote-name"></p><p class="reply-quote-text"></p></div>' : ''}
        <p class="comment-text"></p>
        <span class="comment-time">${formatSentTime(row.created_at)}</span>
      </div>
    `;
    item.querySelector('.comment-text').textContent = cleanMessage;

    if(row.reply_name){
      item.querySelector('.reply-quote-name').textContent = row.reply_name;
      item.querySelector('.reply-quote-text').textContent = row.reply_message || '';
    }

    const bubbleEl = item.querySelector('.comment-bubble');
    attachHoldToReply(bubbleEl, () => setReplyTo(displayName, cleanMessage));

    commentsList.appendChild(item);
    scrollToBottom();
  }

  async function loadComments(){
    const { data, error } = await supabaseClient
      .from('comments')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(50);

    if(error){
      commentsEmpty.textContent = 'Check Internet Connection. Try Again';
      console.error(error);
      return;
    }

    if(!data || data.length === 0){
      commentsEmpty.textContent = 'Be first here. Peafowl and Ananda 💌';
      return;
    }

    commentsList.innerHTML = '';
    renderedIds.clear();
    data.reverse().forEach(row => renderComment(row));
    scrollToBottom();
  }

  async function syncMissed(){
    if(!lastSeenAt) return;
    const { data, error } = await supabaseClient
      .from('comments')
      .select('*')
      .gt('created_at', lastSeenAt)
      .order('created_at', { ascending: true })
      .limit(50);

    if(error || !data) return;
    data.forEach(row => renderComment(row));
  }

  commentForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if(hpField.value){ return; }
    if(!USER_IDENTITY){ return; } // jaga-jaga kalau somehow belum verifikasi PIN

    const name = USER_IDENTITY;
    const message = commentMessage.value.trim();
    if(!message) return;

    // batalkan status "sedang mengetik" yang mungkin masih tertunda,
    // gantikan dengan sinyal "berhenti ngetik" begitu kirim
    clearTimeout(typingDebounceTimer);
    typingChannel.send({ type: 'broadcast', event: 'typing', payload: { stopped: true } });

    commentSubmit.disabled = true;

    const { data, error } = await supabaseClient
      .from('comments')
      .insert({
        name,
        message,
        reply_name: replyTo?.name ?? null,
        reply_message: replyTo?.message ?? null
      })
      .select()
      .single();

    if(error){
      commentStatus.textContent = 'failed sending message, try again ya.';
      console.error(error);
      commentSubmit.disabled = false;
      return;
    }

    renderComment(data);
    commentMessage.value = '';
    commentStatus.textContent = '';
    commentSubmit.disabled = false;
    clearReplyTo();
    commentMessage.focus();
  });

  supabaseClient
    .channel('comments-live')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments' }, (payload) => {
      renderComment(payload.new);
    })
    .subscribe();

  loadComments();
</script>

</body>
</html>
