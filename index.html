<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Beautiful Peafowl</title>
<style>
  /* ---------- PIN GATE ---------- */
  .pin-gate{
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #fff5f8 0%, #ffd0dd 45%, #ffb3cb 100%);
    transition: opacity 0.5s ease;
  }
  .pin-gate.hidden{
    opacity: 0;
    pointer-events: none;
  }

  .pin-card{
    text-align: center;
    padding: 28px 26px;
    max-width: 320px;
    width: 100%;
  }
  .pin-card.shake{ animation: pin-shake 0.4s ease; }
  @keyframes pin-shake{
    0%, 100%{ transform: translateX(0); }
    20%, 60%{ transform: translateX(-8px); }
    40%, 80%{ transform: translateX(8px); }
  }

  .pin-icon{ font-size: 2rem; margin-bottom: 8px; }
  .pin-title{
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    font-size: 1.3rem;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .pin-subtitle{
    font-size: 0.8rem;
    opacity: 0.8;
    margin: 0 0 22px;
  }
  .pin-input{
    width: 100%;
    text-align: center;
    letter-spacing: 0.6em;
    font-size: 1.3rem;
    padding: 12px 12px 12px 18px;
    border-radius: 14px;
    border: 1px solid rgba(217,90,125,0.3);
    outline: none;
    margin-bottom: 14px;
    font-family: 'Trebuchet MS', monospace;
    background: #fff;
    color: var(--ink);
  }
  .pin-input:focus{
    border-color: var(--wax);
    box-shadow: 0 0 0 3px rgba(217,90,125,0.15);
  }
  .pin-submit{
    border: none;
    cursor: pointer;
    width: 100%;
    padding: 12px 30px;
    border-radius: 999px;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    background: linear-gradient(160deg, var(--wax-light), var(--wax));
    color: #fff;
    box-shadow: 0 8px 20px rgba(217,90,125,0.35);
    transition: transform 0.15s ease, opacity 0.2s ease;
  }
  .pin-submit:hover{ transform: translateY(-2px); }
  .pin-submit:disabled{ opacity: 0.6; cursor: default; transform: none; }
  .pin-status{
    font-size: 0.78rem;
    color: #c9587c;
    min-height: 18px;
    margin-top: 12px;
  }

  :root{
    --ink: #4b2b3a;
    --wax: #d95a7d;
    --wax-light: #f27a99;
    --admin-blue: #4b7de0;
    --admin-blue-light: #6fa3ff;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; }
  body{
    min-height: 100vh;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    color: var(--ink);
    overflow: hidden;
    position: relative;
  }

  /* ---------- BACKGROUND PER MODE (dipakai bersama Halaman Depan & Chat) ---------- */
  .mode-bg{
    position: fixed;
    inset: 0;
    max-width: 900px;
    margin: 0 auto;
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .mode-bg.active{ opacity: 1; }

  .bg-pagi{ background: linear-gradient(160deg, #ffffff 0%, #ffeef0 45%, #ffd9e4 100%); }
  .bg-siang{ background: linear-gradient(160deg, #fff5f8 0%, #ffd0dd 45%, #ffb3cb 100%); }
  .bg-sore{ background: linear-gradient(160deg, #ffe3d6 0%, #ffc2c9 45%, #f497ae 100%); }
  .bg-malam{ background: linear-gradient(160deg, #5c2740 0%, #7a3350 55%, #532038 100%); }

  .bg-pagi .sun{
    position: absolute; top: 8%; right: 10%; width: 80px; height: 80px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff3d6, #ffcf7a);
    box-shadow: 0 0 55px 18px rgba(255,207,122,0.32);
  }
  .bg-siang .sun{
    position: absolute; top: 6%; left: 50%; transform: translateX(-50%); width: 62px; height: 62px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff9e0, #ffd66b);
    box-shadow: 0 0 44px 14px rgba(255,214,107,0.38);
  }
  .bg-sore .sun{
    position: absolute; bottom: 12%; right: 14%; width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe3ba, #ff9a6e);
    box-shadow: 0 0 55px 18px rgba(255,154,110,0.38);
  }
  .bg-malam .moon{
    position: absolute; top: 8%; right: 12%; width: 56px; height: 56px; border-radius: 50%;
    background: #fff3e0;
    box-shadow: -12px 3px 0 3px #7a3350, 0 0 36px 9px rgba(255,243,224,0.24);
  }

  .bg-pagi .petal, .bg-siang .confetti{
    position: absolute; opacity: 0.5;
    animation: drift-down 9s linear infinite;
  }
  .bg-sore .cloud{
    position: absolute;
    background: rgba(255,255,255,0.5);
    border-radius: 999px;
    filter: blur(1px);
    animation: cloud-move 32s linear infinite;
  }
  .bg-malam .star{
    position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%;
    animation: twinkle 2.4s ease-in-out infinite;
  }

  @keyframes drift-down{
    0%{ transform: translateY(-10vh) rotate(0deg); opacity: 0; }
    10%{ opacity: 0.55; }
    100%{ transform: translateY(110vh) rotate(180deg); opacity: 0; }
  }
  @keyframes cloud-move{
    0%{ transform: translateX(-10vw); } 100%{ transform: translateX(110vw); }
  }
  @keyframes twinkle{
    0%, 100%{ opacity: 0.2; transform: scale(1); } 50%{ opacity: 1; transform: scale(1.6); }
  }

  /* ---------- VIEW SWITCHER (Halaman Depan <-> Chat) ---------- */
  .view{
    position: fixed;
    inset: 0;
    z-index: 1;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .view.is-active{
    opacity: 1;
    pointer-events: auto;
    z-index: 2;
  }

  /* ---------- HALAMAN DEPAN ---------- */
  .view-welcome{
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .welcome-content{
    text-align: center;
    padding: 24px;
    max-width: 380px;
  }
  .welcome-icon{ font-size: 2.4rem; margin-bottom: 10px; }
  .welcome-greeting{
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    font-size: 1.7rem;
    margin: 0 0 8px;
  }
  .welcome-subtitle{
    font-size: 0.88rem;
    opacity: 0.85;
    margin: 0 0 28px;
  }
  .welcome-cta{
    border: none;
    cursor: pointer;
    padding: 12px 30px;
    border-radius: 999px;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    background: linear-gradient(160deg, var(--wax-light), var(--wax));
    color: #fff;
    box-shadow: 0 8px 20px rgba(217,90,125,0.35);
    transition: transform 0.15s ease;
  }
  .welcome-cta:hover{ transform: translateY(-2px); }

  body.mode-malam .welcome-greeting,
  body.mode-malam .welcome-subtitle{ color: #fff0f4; }
  body.mode-malam .welcome-cta{ background: linear-gradient(160deg, #ffb3c9, #ff8fb0); color: #5c2740; }

  /* ---------- SEND LETTER (khusus Ananda) ---------- */
  .letter-send-btn{
    display: block;
    margin: 12px auto 0;
    border: 1px solid rgba(217,90,125,0.4);
    background: transparent;
    color: var(--wax);
    cursor: pointer;
    padding: 10px 26px;
    border-radius: 999px;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .letter-send-btn:hover{ background: rgba(217,90,125,0.08); transform: translateY(-2px); }
  .letter-send-btn[hidden]{ display: none; }
  body.mode-malam .letter-send-btn{ color: #ffd6e2; border-color: rgba(255,255,255,0.4); }

  .letter-compose-overlay,
  .letter-read-overlay{
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(90,40,60,0.45);
    padding: 20px;
  }
  .letter-compose-overlay[hidden],
  .letter-read-overlay[hidden]{ display: none; }

  .letter-compose-card,
  .letter-read-card{
    position: relative;
    width: 100%;
    max-width: 380px;
    max-height: 85vh;
    overflow-y: auto;
    background: linear-gradient(170deg, #fffaf6, #fdf0e8);
    border-radius: 16px;
    padding: 30px 24px 24px;
    box-shadow: 0 20px 50px rgba(90,40,60,0.35);
    text-align: center;
    animation: letter-pop 0.35s ease;
  }
  @keyframes letter-pop{
    0%{ opacity: 0; transform: scale(0.9); }
    100%{ opacity: 1; transform: scale(1); }
  }

  .letter-close-btn{
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: rgba(217,90,125,0.12);
    color: #c9587c;
    font-size: 0.85rem;
    display: flex; align-items: center; justify-content: center;
  }

  .letter-compose-title{
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    font-size: 1.15rem;
    color: var(--ink);
    margin: 0 0 14px;
  }
  .letter-compose-textarea{
    width: 100%;
    min-height: 140px;
    resize: vertical;
    border: 1px solid rgba(217,90,125,0.25);
    border-radius: 10px;
    padding: 12px;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.88rem;
    color: var(--ink);
    outline: none;
    margin-bottom: 12px;
  }
  .letter-compose-textarea:focus{ border-color: var(--wax); box-shadow: 0 0 0 3px rgba(217,90,125,0.15); }

  .letter-send-to-btn{
    border: none;
    cursor: pointer;
    width: 100%;
    padding: 11px 20px;
    border-radius: 999px;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    background: linear-gradient(160deg, var(--wax-light), var(--wax));
    color: #fff;
    box-shadow: 0 8px 18px rgba(217,90,125,0.3);
  }
  .letter-send-to-btn:disabled{ opacity: 0.6; cursor: default; }
  .letter-compose-status{
    font-size: 0.75rem;
    color: #c9748f;
    min-height: 16px;
    margin: 8px 0 0;
  }

  .letter-read-seal{ font-size: 2rem; margin-bottom: 8px; }
  .letter-read-heading{
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    font-size: 1.2rem;
    color: var(--ink);
    margin: 0 0 14px;
  }
  .letter-read-body{
    font-size: 0.92rem;
    line-height: 1.7;
    color: var(--ink);
    white-space: pre-line;
    text-align: left;
    margin: 0 0 14px;
  }
  .letter-read-time{
    font-size: 0.7rem;
    color: #c9748f;
    margin: 0;
  }

  .letter-toast{
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    z-index: 70;
    background: linear-gradient(160deg, var(--wax-light), var(--wax));
    color: #fff;
    padding: 10px 22px;
    border-radius: 999px;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    box-shadow: 0 10px 24px rgba(217,90,125,0.4);
    animation: letter-toast-in 0.3s ease, letter-toast-out 0.3s ease 2s forwards;
  }
  .letter-toast[hidden]{ display: none; }
  @keyframes letter-toast-in{
    0%{ opacity: 0; transform: translateX(-50%) translateY(10px); }
    100%{ opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @keyframes letter-toast-out{
    0%{ opacity: 1; } 100%{ opacity: 0; }
  }

  /* ---------- KARTU SURAT DI CHAT ---------- */
  .letter-card{
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(160deg, #fffaf6, #fdf0e8);
    border: 1px solid rgba(217,90,125,0.25);
    border-radius: 14px;
    padding: 12px 16px;
    max-width: 220px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(217,90,125,0.15);
    transition: transform 0.15s ease;
  }
  .letter-card:hover{ transform: translateY(-2px); }
  .letter-card-icon{ font-size: 1.6rem; flex: none; }
  .letter-card-text{ text-align: left; }
  .letter-card-from{
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    font-size: 0.85rem;
    color: var(--ink);
    margin: 0;
  }
  .letter-card-hint{
    font-size: 0.65rem;
    color: #c9748f;
    margin: 2px 0 0;
  }
  .letter-card.opened{ opacity: 0.75; }
  .letter-card.opened .letter-card-icon{ filter: grayscale(0.3); }

  /* ---------- CHAT ---------- */
  .view-chat{
    display: flex;
    flex-direction: column;
  }

  .chat-header{
    position: relative;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 16px 14px;
    border-bottom: 1px solid rgba(217,90,125,0.15);
    transition: border-color 0.8s ease;
  }
  body.mode-malam .chat-header{ border-color: rgba(255,255,255,0.15); }

  .back-btn{
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: rgba(217,90,125,0.12);
    color: #c9587c;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
  }
  body.mode-malam .back-btn{ background: rgba(255,255,255,0.15); color: #fff0f4; }

  .mode-icon{ font-size: 1.6rem; }

  .chat-area{
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px 18px 10px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .bubble-row{
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    animation: bubble-in 0.3s ease both;
  }
  .bubble-row.admin{ align-items: flex-start; }
  @keyframes bubble-in{
    0%{ opacity: 0; transform: translateY(6px); } 100%{ opacity: 1; transform: translateY(0); }
  }

  .comment-name{
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    color: #c9587c;
    margin: 0 6px 3px 0;
  }
  .bubble-row.admin .comment-name{ margin: 0 0 3px 6px; color: var(--admin-blue); }

  .comment-bubble{
    position: relative;
    background: linear-gradient(160deg, #ffffff, #fdf0f4);
    border-radius: 14px 4px 14px 14px;
    padding: 8px 12px;
    box-shadow: 0 2px 6px rgba(217,90,125,0.1);
    max-width: 86%;
  }
  .comment-bubble.admin{
    background: linear-gradient(160deg, var(--admin-blue-light), var(--admin-blue));
    border-radius: 4px 14px 14px 14px;
    box-shadow: 0 2px 6px rgba(75,125,224,0.25);
  }

  .comment-text{
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.85rem;
    line-height: 1.4;
    color: var(--ink);
    margin: 0;
    word-break: break-word;
  }
  .comment-bubble.admin .comment-text{ color: #fff; }

  .comment-time{
    display: block;
    margin-top: 3px;
    text-align: right;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.6rem;
    color: #d7a3b3;
    white-space: nowrap;
  }
  .comment-bubble.admin .comment-time{ color: rgba(255,255,255,0.75); text-align: left; }

  .comments-empty{
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.8rem;
    color: #c9748f;
    text-align: center;
    padding: 18px 0;
    opacity: 0.75;
  }

  .load-older-btn{
    display: block;
    margin: 4px auto 8px;
    padding: 6px 16px;
    border: none;
    border-radius: 999px;
    background: rgba(217,90,125,0.1);
    color: #c9587c;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.72rem;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  .load-older-btn:hover{ background: rgba(217,90,125,0.18); }
  .load-older-btn:disabled{ opacity: 0.5; cursor: default; }
  .load-older-btn[hidden]{ display: none; }

  /* ---------- REPLY (tahan/hold bubble buat membalas) ---------- */
  .comment-bubble{
    cursor: pointer;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    transition: transform 0.15s ease;
  }
  .comment-bubble.pressing{ transform: scale(0.96); }
  .comment-bubble.reply-flash{ animation: reply-flash 0.4s ease; }
  @keyframes reply-flash{
    0%{ box-shadow: 0 0 0 0 rgba(217,90,125,0.5); }
    100%{ box-shadow: 0 0 0 12px rgba(217,90,125,0); }
  }
  .comment-bubble.admin.reply-flash{ animation: reply-flash-admin 0.4s ease; }
  @keyframes reply-flash-admin{
    0%{ box-shadow: 0 0 0 0 rgba(75,125,224,0.5); }
    100%{ box-shadow: 0 0 0 12px rgba(75,125,224,0); }
  }

  .reply-quote{
    border-left: 3px solid var(--wax);
    background: rgba(217,90,125,0.08);
    border-radius: 6px;
    padding: 4px 8px;
    margin-bottom: 5px;
  }
  .comment-bubble.admin .reply-quote{
    border-left-color: #fff;
    background: rgba(255,255,255,0.18);
  }
  .reply-quote-name{
    font-size: 0.62rem;
    font-weight: 700;
    color: var(--wax);
    margin: 0;
  }
  .comment-bubble.admin .reply-quote-name{ color: #fff; }
  .reply-quote-text{
    font-size: 0.72rem;
    color: #8a5566;
    margin: 1px 0 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
  }
  .comment-bubble.admin .reply-quote-text{ color: rgba(255,255,255,0.85); }

  .reply-banner{
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 18px 8px;
    padding: 6px 10px;
    background: rgba(217,90,125,0.08);
    border-left: 3px solid var(--wax);
    border-radius: 8px;
  }
  .reply-banner[hidden]{ display: none; }

  .reply-banner-text{ flex: 1; min-width: 0; }
  .reply-banner-name{
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--wax);
    margin: 0;
  }
  .reply-banner-message{
    font-size: 0.72rem;
    color: #8a5566;
    margin: 1px 0 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .reply-banner-close{
    flex: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: rgba(217,90,125,0.15);
    color: #c9587c;
    font-size: 0.7rem;
    display: flex; align-items: center; justify-content: center;
  }
  body.mode-malam .reply-banner{ background: rgba(255,255,255,0.1); }
  body.mode-malam .reply-banner-name{ color: #ffc9db; }
  body.mode-malam .reply-banner-message{ color: #f2c6d4; }

  /* ---------- INDIKATOR SEDANG MENGETIK ---------- */
  .typing-indicator{
    flex: none;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.7rem;
    font-style: italic;
    color: #c9748f;
    margin: 0 18px 6px;
  }
  .typing-indicator[hidden]{ display: none; }
  .typing-indicator #typingName{ font-weight: 700; font-style: normal; }
  .typing-indicator.admin #typingName{ color: var(--admin-blue); }
  .typing-indicator.admin .typing-dots span{ background: var(--admin-blue); }

  .typing-dots{ display: inline-flex; align-items: center; gap: 2px; }
  .typing-dots span{
    width: 4px; height: 4px; border-radius: 50%; background: #e08098;
    animation: typing-bounce 1.1s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2){ animation-delay: 0.15s; }
  .typing-dots span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes typing-bounce{
    0%, 60%, 100%{ transform: translateY(0); opacity: 0.5; } 30%{ transform: translateY(-3px); opacity: 1; }
  }

  /* ---------- INPUT BAR ---------- */
  .comment-form{
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 18px 18px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(217,90,125,0.15);
    background: rgba(255,255,255,0.5);
    transition: border-color 0.8s ease, background 0.8s ease;
  }
  body.mode-malam .comment-form{ border-color: rgba(255,255,255,0.15); background: rgba(0,0,0,0.15); }

  /* ---------- STATUS ONLINE ---------- */
  .presence-status{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
    font-size: 0.72rem;
    color: #a85c76;

    if(presenceStarted || !USER_IDENTITY) return;
    presenceStarted = true;

    const presenceChannel = supabaseClient.channel('presence-status');

    presenceChannel
      .on('presence', { event: 'sync' }, () => {
        updatePresenceUI(presenceChannel.presenceState());
      })
      .subscribe(async (status) => {

  // tahan bubble chat sejenak buat membalasnya, gaya WhatsApp/Telegram
  const HOLD_DURATION_MS = 450;
  const MOVE_CANCEL_PX = 10;

  function attachHoldToReply(bubbleEl, onHold){
    let timer = null;
    let startX = 0, startY = 0;
    let moved = false;

    function start(e){
      moved = false;
      startX = e.clientX;
      startY = e.clientY;
      bubbleEl.classList.add('pressing');
      timer = setTimeout(() => {
        if(moved) return;
        bubbleEl.classList.remove('pressing');
        bubbleEl.classList.add('reply-flash');
        setTimeout(() => bubbleEl.classList.remove('reply-flash'), 400);
        if(navigator.vibrate) navigator.vibrate(12);
        onHold();
      }, HOLD_DURATION_MS);
    }
    function move(e){
      if(Math.abs(e.clientX - startX) > MOVE_CANCEL_PX || Math.abs(e.clientY - startY) > MOVE_CANCEL_PX){
        moved = true;
        cancel();
      }
    }
    function cancel(){
      clearTimeout(timer);
      bubbleEl.classList.remove('pressing');
    }

    bubbleEl.addEventListener('pointerdown', start);
    bubbleEl.addEventListener('pointermove', move);
    bubbleEl.addEventListener('pointerup', cancel);
    bubbleEl.addEventListener('pointerleave', cancel);
    bubbleEl.addEventListener('pointercancel', cancel);

  // bikin keyboard mobile gak sempat nutup pas milih emoji
  emojiToggle.addEventListener('mousedown', (e) => e.preventDefault());
  emojiPanel.addEventListener('mousedown', (e) => e.preventDefault());

  emojiPanel.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    const emoji = btn.textContent;
    const start = commentMessage.selectionStart ?? commentMessage.value.length;
    const end = commentMessage.selectionEnd ?? commentMessage.value.length;
    const val = commentMessage.value;
    commentMessage.value = val.slice(0, start) + emoji + val.slice(end);
    const newPos = start + emoji.length;
    commentMessage.focus();
    commentMessage.setSelectionRange(newPos, newPos);
  });

  document.addEventListener('click', (e) => {
    if(emojiPanel.hidden) return;
    if(e.target === emojiToggle || emojiPanel.contains(e.target)) return;
    emojiPanel.hidden = true;
    emojiToggle.classList.remove('active');
  });

  // ---------- STICKER PICKER ----------
  const STICKER_FILES = [
    'Peafowl 1.png','Peafowl 2.png','Peafowl 3.png','Peafowl 4.png','Peafowl 5.png',
    'Peafowl 6.png','Peafowl 7.png','Peafowl 8.png','Peafowl 9.png','Peafowl 10.png',
    'Peafowl 11.png','Peafowl 12.png','Peafowl 13.png','Peafowl 14.png','Peafowl 15.png',
    'Peafowl 16.png','Peafowl 17.png','Peafowl 18.png'
  ];
  const STICKER_BASE_URL = SUPABASE_URL + '/storage/v1/object/public/stickers/';

  function stickerUrl(file){
    return STICKER_BASE_URL + encodeURIComponent(file);
  }

  stickerToggleIcon.src = stickerUrl(STICKER_FILES[0]);
  stickerPanel.innerHTML = STICKER_FILES.map(file =>
    `<button type="button" data-file="${escapeHtml(file)}"><img src="${stickerUrl(file)}" alt="stiker" loading="lazy"></button>`
  ).join('');

  stickerToggle.addEventListener('mousedown', (e) => e.preventDefault());
  stickerPanel.addEventListener('mousedown', (e) => e.preventDefault());

  stickerToggle.addEventListener('click', () => {
    const willOpen = stickerPanel.hidden;
    stickerPanel.hidden = !willOpen;
    stickerToggle.classList.toggle('active', willOpen);
    // panel emoji ditutup biar gak numpuk berdua
    emojiPanel.hidden = true;
    emojiToggle.classList.remove('active');
  });

  stickerPanel.addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    if(!USER_IDENTITY) return;

    stickerPanel.hidden = true;
    stickerToggle.classList.remove('active');

    clearTimeout(typingDebounceTimer);
    typingChannel.send({ type: 'broadcast', event: 'typing', payload: { stopped: true } });

    const { data, error } = await supabaseClient
      .from('comments')
      .insert({
        name: USER_IDENTITY,
        message: '',
        sticker: btn.dataset.file,
        reply_name: replyTo?.name ?? null,
        reply_message: replyTo?.message ?? null
      })
      .select()
      .single();

    if(error){
      console.error(error);
      return;
    }

    renderComment(data);
    clearReplyTo();
  });

  document.addEventListener('click', (e) => {
    if(stickerPanel.hidden) return;
    if(e.target === stickerToggle || stickerToggle.contains(e.target) || stickerPanel.contains(e.target)) return;
    stickerPanel.hidden = true;
    stickerToggle.classList.remove('active');
  });

  // ---------- LETTER (surat khusus dari Ananda) ----------
  const letterComposeOverlay = document.getElementById('letterComposeOverlay');
  const letterComposeClose = document.getElementById('letterComposeClose');
  const letterComposeText = document.getElementById('letterComposeText');
  const letterSendToBtn = document.getElementById('letterSendToBtn');
  const letterComposeStatus = document.getElementById('letterComposeStatus');
  const letterReadOverlay = document.getElementById('letterReadOverlay');
  const letterReadClose = document.getElementById('letterReadClose');
  const letterReadBody = document.getElementById('letterReadBody');
  const letterReadTime = document.getElementById('letterReadTime');
  const letterToast = document.getElementById('letterToast');

  letterSendBtn.addEventListener('click', () => {
    letterComposeText.value = ''; // selalu kosong tiap dibuka, gak nyimpen draft
    letterComposeStatus.textContent = '';
    letterComposeOverlay.hidden = false;
    letterComposeText.focus();
  });

  letterComposeClose.addEventListener('click', () => {
    letterComposeOverlay.hidden = true;
  });

  letterSendToBtn.addEventListener('click', async () => {
    const text = letterComposeText.value.trim();
    if(!text){
      letterComposeStatus.textContent = 'Tulis dulu suratnya ya.';
      return;
    }
    if(!USER_IDENTITY || USER_IDENTITY !== 'Ananda') return;

    letterSendToBtn.disabled = true;
    letterComposeStatus.textContent = 'Sending...';

    const { data, error } = await supabaseClient
      .from('comments')
      .insert({
        name: 'Ananda',
        message: '',
        letter_content: text,
        letter_opened: false
      })
      .select()
      .single();

    letterSendToBtn.disabled = false;

    if(error){
      letterComposeStatus.textContent = 'Gagal mengirim, coba lagi ya.';
      console.error(error);
      return;
    }

    letterComposeOverlay.hidden = true;
    letterComposeText.value = '';
    renderComment(data);
    showLetterToast();
  });

  function showLetterToast(){
    letterToast.hidden = false;
    // reset animasi biar bisa retrigger kalau dipanggil berkali-kali
    letterToast.style.animation = 'none';
    void letterToast.offsetWidth;
    letterToast.style.animation = '';
    setTimeout(() => { letterToast.hidden = true; }, 2400);
  }

  // buka popup baca surat -- SENGAJA gak ada handler klik backdrop,
  // cuma bisa ditutup lewat tombol X
  async function openLetter(row, cardEl){
    letterReadBody.textContent = row.letter_content || '';
    letterReadTime.textContent = formatSentTime(row.created_at);
    letterReadOverlay.hidden = false;

    // status "sudah dibaca" cuma di-update kalau yang buka itu Peafowl
    // (bukan Ananda yang lagi ngecek suratnya sendiri)
    if(!row.letter_opened && USER_IDENTITY === 'Peafowl'){
      row.letter_opened = true;
      if(cardEl) cardEl.classList.add('opened');
      const { error } = await supabaseClient
        .from('comments')
        .update({ letter_opened: true })
        .eq('id', row.id);
      if(error) console.error(error);
    }
  }

  letterReadClose.addEventListener('click', () => {
    letterReadOverlay.hidden = true;
  });

  // event delegation: kartu surat dibikin dinamis oleh renderComment,
  // jadi listener klik-nya ditaruh di container-nya
  commentsList.addEventListener('click', (e) => {
    const card = e.target.closest('.letter-card');
    if(!card) return;
    const row = {
      id: card.dataset.id,
      letter_content: card.dataset.letterContent,
      letter_opened: card.classList.contains('opened'),
      created_at: card.dataset.createdAt
    };
    openLetter(row, card);
  });

  // ---------- INDIKATOR SEDANG MENGETIK (Supabase Realtime Broadcast) ----------
  const typingChannel = supabaseClient.channel('typing-status');
  let hideTypingTimeout = null;
  let typingDebounceTimer = null;
  const TYPING_DEBOUNCE_MS = 500;
  const TYPING_HIDE_MS = 3500;

  typingChannel
    .on('broadcast', { event: 'typing' }, ({ payload }) => {
      clearTimeout(hideTypingTimeout);

      // sinyal "berhenti ngetik" (dikirim begitu lawan bicara jadi kirim
      // pesan) -> langsung sembunyikan, gak perlu nunggu timeout habis
      if(payload?.stopped){
        typingIndicator.hidden = true;
        return;
      }

      typingName.textContent = payload?.name || 'Seseorang';
      typingIndicator.classList.toggle('admin', !!payload?.admin);
      typingIndicator.hidden = false;
      hideTypingTimeout = setTimeout(() => { typingIndicator.hidden = true; }, TYPING_HIDE_MS);
    })
    .subscribe();

  commentMessage.addEventListener('input', () => {
    clearTimeout(typingDebounceTimer);
    typingDebounceTimer = setTimeout(() => {
      typingChannel.send({
        type: 'broadcast',
        event: 'typing',
        payload: {
          name: USER_IDENTITY,
          admin: USER_IDENTITY === 'Ananda'
        }
      });
    }, TYPING_DEBOUNCE_MS);
  });

  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && viewChat.classList.contains('is-active')) syncMissed();
  });

  function scrollToBottom(){
    requestAnimationFrame(() => {
      commentsListWrap.scrollTop = commentsListWrap.scrollHeight;
    });
  }

  function formatSentTime(dateStr){
    const d = new Date(dateStr);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const timePart = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    if(sameDay) return timePart;
    const datePart = d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' });
    return datePart + ', ' + timePart;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderComment(row, prepend){
    if(row.id != null){
      if(renderedIds.has(row.id)) return;
      renderedIds.add(row.id);
    }
    if(!prepend && (!lastSeenAt || new Date(row.created_at) > new Date(lastSeenAt))){
      lastSeenAt = row.created_at;
    }
    commentsEmpty.remove?.();

    const cleanMessage = row.message || '';
    const isAdmin = row.name === 'Ananda';
    const displayName = row.name;
    const isSticker = !!row.sticker;
    const isLetter = !!row.letter_content;

    const item = document.createElement('div');
    item.className = 'bubble-row' + (isAdmin ? ' admin' : '');
    item.dataset.id = row.id;

    if(isLetter){
      const opened = !!row.letter_opened;
      item.innerHTML = `
        <div class="letter-card${opened ? ' opened' : ''}" data-id="${row.id}" data-created-at="${row.created_at}">
          <span class="letter-card-icon">${opened ? '💌' : '✉️'}</span>
          <div class="letter-card-text">
            <p class="letter-card-from">From Ibu</p>
            <p class="letter-card-hint">${opened ? 'Opened' : 'Tap to open'}</p>
          </div>
        </div>
      `;
      item.querySelector('.letter-card').dataset.letterContent = row.letter_content;
      if(prepend){
        loadOlderBtn.insertAdjacentElement('afterend', item);
      } else {
        commentsList.appendChild(item);
        scrollToBottom();
      }
      return;
    }

    if(isSticker){
      item.innerHTML = `
        <p class="comment-name">${escapeHtml(displayName)}</p>
        <div class="sticker-bubble">
          ${row.reply_name ? '<div class="reply-quote"><p class="reply-quote-name"></p><p class="reply-quote-text"></p></div>' : ''}
          <img src="${stickerUrl(row.sticker)}" alt="stiker" loading="lazy">
          <span class="sticker-time">${formatSentTime(row.created_at)}</span>
        </div>
      `;
      if(row.reply_name){
        item.querySelector('.reply-quote-name').textContent = row.reply_name;
        item.querySelector('.reply-quote-text').textContent = row.reply_message || '';
      }
      if(prepend){
        loadOlderBtn.insertAdjacentElement('afterend', item);
      } else {
        commentsList.appendChild(item);
        scrollToBottom();
      }
      return;
    }

    item.innerHTML = `
      <p class="comment-name">${escapeHtml(displayName)}</p>
      <div class="comment-bubble${isAdmin ? ' admin' : ''}">
        ${row.reply_name ? '<div class="reply-quote"><p class="reply-quote-name"></p><p class="reply-quote-text"></p></div>' : ''}
        <p class="comment-text"></p>
        <span class="comment-time">${formatSentTime(row.created_at)}</span>
      </div>
    `;
    item.querySelector('.comment-text').textContent = cleanMessage;

    if(row.reply_name){
      item.querySelector('.reply-quote-name').textContent = row.reply_name;
      item.querySelector('.reply-quote-text').textContent = row.reply_message || '';
    }

    const bubbleEl = item.querySelector('.comment-bubble');
    attachHoldToReply(bubbleEl, () => setReplyTo(displayName, cleanMessage));

    if(prepend){
      loadOlderBtn.insertAdjacentElement('afterend', item);
    } else {
      commentsList.appendChild(item);
      scrollToBottom();
    }
  }

  let oldestLoadedAt = null;

  async function loadComments(){
    const { data, error } = await supabaseClient
      .from('comments')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(50);

    if(error){
      commentsEmpty.textContent = 'Check Internet Connection. Try Again';
      console.error(error);
      return;
    }

    if(!data || data.length === 0){
      commentsEmpty.textContent = 'Be first here. Peafowl and Ananda 💌';
      return;
    }

    commentsList.innerHTML = '';
    commentsList.appendChild(loadOlderBtn); // innerHTML='' ikut buang tombolnya, pasang lagi
    renderedIds.clear();
    data.reverse().forEach(row => renderComment(row));

    oldestLoadedAt = data[0].created_at;
    loadOlderBtn.hidden = (data.length < 50); // kurang dari 50 berarti udah abis semua riwayatnya
    scrollToBottom();
  }

  async function loadOlderComments(){
    if(!oldestLoadedAt) return;
    loadOlderBtn.disabled = true;
    loadOlderBtn.textContent = 'Loading...';

    const scrollBefore = commentsListWrap.scrollHeight;

    const { data, error } = await supabaseClient
      .from('comments')
      .select('*')
      .lt('created_at', oldestLoadedAt)
      .order('created_at', { ascending: false })
      .limit(30);

    loadOlderBtn.disabled = false;
    loadOlderBtn.textContent = 'Load older messages';

    if(error || !data || data.length === 0){
      loadOlderBtn.hidden = true;
      return;
    }

    // JANGAN di-reverse: data dari query ini urutannya dari yang paling
    // baru (dalam batch ini) ke paling lama. Karena tiap item ditempel
    // "afterend" tombol (jadi selalu nyodok ke urutan paling atas), proses
    // dalam urutan aslinya (turun) justru bikin hasil akhirnya kronologis
    // dengan benar dari lama ke baru.
    data.forEach(row => renderComment(row, true));

    oldestLoadedAt = data[data.length - 1].created_at;
    loadOlderBtn.hidden = (data.length < 30);

    // jaga posisi scroll biar gak "loncat" pas pesan lama nyempil di atas
    commentsListWrap.scrollTop = commentsListWrap.scrollHeight - scrollBefore;
  }

  loadOlderBtn.addEventListener('click', loadOlderComments);

  async function syncMissed(){
    if(!lastSeenAt) return;
    const { data, error } = await supabaseClient
      .from('comments')
      .select('*')
      .gt('created_at', lastSeenAt)
      .order('created_at', { ascending: true })
      .limit(50);

    if(error || !data) return;
    data.forEach(row => renderComment(row));
  }

  commentForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if(hpField.value){ return; }
    if(!USER_IDENTITY){ return; } // jaga-jaga kalau somehow belum verifikasi PIN

    const name = USER_IDENTITY;
    const message = commentMessage.value.trim();
    if(!message) return;

    // batalkan status "sedang mengetik" yang mungkin masih tertunda,
    // gantikan dengan sinyal "berhenti ngetik" begitu kirim
    clearTimeout(typingDebounceTimer);
    typingChannel.send({ type: 'broadcast', event: 'typing', payload: { stopped: true } });

    commentSubmit.disabled = true;

    const { data, error } = await supabaseClient
      .from('comments')
      .insert({
        name,
        message,
        reply_name: replyTo?.name ?? null,
        reply_message: replyTo?.message ?? null
      })
      .select()
      .single();

    if(error){
      commentStatus.textContent = 'failed sending message, try again ya.';
      console.error(error);
      commentSubmit.disabled = false;
      return;
    }

    renderComment(data);
    commentMessage.value = '';
    commentStatus.textContent = '';
    commentSubmit.disabled = false;
    clearReplyTo();
    commentMessage.focus();
  });

  supabaseClient
    .channel('comments-live')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments' }, (payload) => {
      renderComment(payload.new);
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'comments' }, (payload) => {
      // sinkronisasi status "sudah dibaca" ke browser lain (misal Ananda
      // liat kartu suratnya berubah begitu Peafowl buka, tanpa reload)
      if(!payload.new?.letter_opened) return;
      const cardEl = commentsList.querySelector(`.letter-card[data-id="${payload.new.id}"]`);
      if(cardEl && !cardEl.classList.contains('opened')){
        cardEl.classList.add('opened');
        cardEl.querySelector('.letter-card-icon').textContent = '💌';
        cardEl.querySelector('.letter-card-hint').textContent = 'Opened';
      }
    })
    .subscribe();

  loadComments();

  // begitu reload, kalau identitas masih diinget DAN sebelumnya lagi di
  // Chat, langsung balik ke Chat lagi -- gak direset ke Halaman Depan.
  // Ditaruh di paling akhir biar semua variabel chat (lastSeenAt, dll)
  // sudah pasti siap duluan sebelum dipakai.
  if(USER_IDENTITY && sessionStorage.getItem('currentView') === 'chat'){
    viewWelcome.classList.remove('is-active');
    viewChat.classList.add('is-active');
    syncMissed();
    scrollToBottom();
  }
</script>

</body>
</html>
